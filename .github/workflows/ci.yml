name: macOS build and security invariants
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Source policy audit
        run: python3 scripts/audit.py
      - name: Shell and bundle metadata validation
        run: |
          bash -n scripts/build.sh
          plutil -lint Resources/Info.plist
      - name: Unit tests
        run: swift test
      - name: Build and verify our app bundle
        run: scripts/build.sh
